# ==============================================================================
# OmniFlow EMS — Dedicated Sandbox ERP Engine (Odoo 19 + PostgreSQL 16)
# Local Docker Bridge (Auto-Init with 30s Grace Period)
# ==============================================================================

services:
  # 1. Ultra-lightweight PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: omniflow_sandbox_erp_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: omniflow_sandbox_erp
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo_sandbox_secure_pass
    volumes:
      - ./storage/postgres_data:/var/lib/postgresql/data
    networks:
      - omniflow_erp_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d omniflow_sandbox_erp || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s

  # 2. Odoo 19 Community Core Engine
  odoo:
    image: odoo:19.0
    container_name: omniflow_sandbox_erp_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "0.0.0.0:8069:8069" # Direct access via VPS IP
      - "0.0.0.0:8072:8072"
    volumes:
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./storage/filestore:/var/lib/odoo
      - ./storage/logs:/var/log/odoo
    environment:
      - HOST=postgres
      - USER=odoo
      - PASSWORD=odoo_sandbox_secure_pass
    networks:
      - omniflow_erp_net

networks:
  omniflow_erp_net:
    driver: bridge
