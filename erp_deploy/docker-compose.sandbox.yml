# ==============================================================================
# OmniFlow EMS — Dedicated Sandbox ERP Engine (Odoo 19)
# Mode: Direct VPS Public IP Access (http://66.29.135.156:8069)
# Database: Supabase Cloud PostgreSQL (ap-south-1)
# ==============================================================================

services:
  odoo:
    image: odoo:19.0
    container_name: omniflow_sandbox_erp_app
    restart: unless-stopped
    ports:
      - "0.0.0.0:8069:8069" # Accessible via public IP
      - "0.0.0.0:8072:8072"
    volumes:
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./storage/filestore:/var/lib/odoo
      - ./storage/logs:/var/log/odoo
