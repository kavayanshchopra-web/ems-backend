# ==============================================================================
# OmniFlow EMS — Dedicated Sandbox ERP Engine (Odoo 19)
# Database: Supabase Cloud PostgreSQL (ap-south-1) - Zero Local DB Overhead!
# Domain Target: sandbox-erp.employeemanagementsystems.com
# ==============================================================================

services:
  odoo:
    image: odoo:19.0
    container_name: omniflow_sandbox_erp_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8069:8069"
      - "127.0.0.1:8072:8072"
    volumes:
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./storage/filestore:/var/lib/odoo
      - ./storage/logs:/var/log/odoo
