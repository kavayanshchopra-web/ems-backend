<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniFlow WhatsApp CRM</title>
  <style>
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background: #111b21;
      color: #e9edef;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #14d2cb;
    }
    .badge {
      font-size: 10px;
      background: rgba(0, 168, 132, 0.2);
      color: #00a884;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      font-size: 11px;
      color: #8696a0;
      display: block;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      background: #202c33;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 8px 10px;
      color: #e9edef;
      font-size: 12px;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: #0d9488;
    }
    button {
      width: 100%;
      background: #0d9488;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
    }
    button:hover {
      background: #0f766e;
    }
    .footer-links {
      margin-top: 14px;
      text-align: center;
      font-size: 11px;
    }
    .footer-links a {
      color: #14d2cb;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">⚡ OmniFlow CRM</div>
    <div class="badge">Hybrid Suite</div>
  </div>

  <div class="form-group">
    <label>Cloud Gateway URL:</label>
    <input type="text" id="gateway-input" placeholder="https://..." />
  </div>

  <div class="form-group">
    <label>Staff Name / Workspace ID:</label>
    <input type="text" id="staff-name-input" placeholder="e.g. Pushpa / Sales Team 1" />
  </div>

  <button id="save-btn">Save Configuration</button>

  <div class="footer-links">
    <a href="https://web.whatsapp.com" target="_blank" rel="noopener noreferrer">Open WhatsApp Web ↗</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
