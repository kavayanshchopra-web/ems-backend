<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMS SaaS Logo Options</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    
    body {
      margin: 0;
      padding: 40px;
      background-color: #0F172A;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #0db49e 0%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
    }

    p.subtitle {
      font-size: 14px;
      color: #94A3B8;
      margin-bottom: 40px;
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
      max-width: 900px;
      width: 100%;
    }

    .card {
      background: #1E293B;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      min-height: 150px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .card-title {
      position: absolute;
      top: 12px;
      left: 16px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #64748B;
    }

    .gradient-text {
      background: linear-gradient(135deg, #0db49e 0%, #06b6d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Option 1: Classic Refined Gradient */
    .logo-d1 {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .logo-d1-main {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-d1-icon {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 24px;
    }
    .logo-d1-bar {
      height: 5px;
      border-radius: 3px;
      background: linear-gradient(135deg, #0db49e 0%, #06b6d4 100%);
    }

    /* Option 2: SaaS Infinity Flow */
    .logo-d2 {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-d2-icon {
      width: 32px;
      height: 32px;
    }

    /* Option 3: Modular Nodes E */
    .logo-d3 {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-d3-icon {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .logo-d3-block {
      width: 8px;
      height: 8px;
      border-radius: 3px;
      background: linear-gradient(135deg, #0db49e 0%, #06b6d4 100%);
    }

    /* Option 4: Chevron Growth E */
    .logo-d4 {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-d4-icon {
      width: 28px;
      height: 28px;
    }

    /* Option 5: Hexagonal Connected Mark */
    .logo-d5 {
      grid-column: span 2;
      background: #1E293B;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      min-height: 150px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .logo-d5-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }
  </style>
</head>
<body>

  <h1>EMS SaaS Logo Options</h1>
  <p class="subtitle">Modern, Minimalist SaaS Brand Marks with matching Teal Gradient Icon & Text</p>

  <div class="grid">
    <!-- Option 1 -->
    <div class="card">
      <span class="card-title">Option 1: Refined Classic</span>
      <div class="logo-d1">
        <div class="logo-d1-main">
          <div class="logo-d1-icon">
            <div class="logo-d1-bar" style="width: 100%;"></div>
            <div class="logo-d1-bar" style="width: 80%;"></div>
            <div class="logo-d1-bar" style="width: 90%;"></div>
          </div>
          <span style="font-size: 28px; font-weight: 850;" class="gradient-text">EMS</span>
        </div>
        <span style="font-size: 8px; font-weight: 700; color: #0db49e; letter-spacing: 2px; text-transform: uppercase; margin-top: 4px;">EMPLOYEE MANAGEMENT SYSTEM</span>
      </div>
    </div>

    <!-- Option 2 -->
    <div class="card">
      <span class="card-title">Option 2: SaaS Infinity Flow</span>
      <div class="logo-d2">
        <svg class="logo-d2-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 6C9.79086 6 8 7.79086 8 10C8 12.2091 9.79086 14 12 14C14.2091 14 16 12.2091 16 10C16 7.79086 14.2091 6 12 6Z" stroke="url(#gradient)" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M4 14C4 11.7909 5.79086 10 8 10C10.2091 10 12 11.7909 12 14C12 16.2091 10.2091 18 8 18C5.79086 18 4 16.2091 4 14Z" stroke="url(#gradient)" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M12 10C12 7.79086 13.7909 6 16 6C18.2091 6 20 7.79086 20 10C20 12.2091 18.2091 14 16 14C13.7909 14 12 12.2091 12 10Z" stroke="url(#gradient)" stroke-width="2.5" stroke-linecap="round"/>
          <defs>
            <linearGradient id="gradient" x1="4" y1="6" x2="20" y2="18" gradientUnits="userSpaceOnUse">
              <stop stop-color="#0db49e"/>
              <stop offset="1" stop-color="#06b6d4"/>
            </linearGradient>
          </defs>
        </svg>
        <span style="font-size: 28px; font-weight: 850;" class="gradient-text">EMS</span>
      </div>
    </div>

    <!-- Option 3 -->
    <div class="card">
      <span class="card-title">Option 3: Modular Nodes E</span>
      <div class="logo-d3">
        <div class="logo-d3-icon">
          <div class="logo-d3-block"></div>
          <div class="logo-d3-block" style="opacity: 0.85;"></div>
          <div class="logo-d3-block" style="opacity: 0.7;"></div>
        </div>
        <span style="font-size: 28px; font-weight: 850;" class="gradient-text">EMS</span>
      </div>
    </div>

    <!-- Option 4 -->
    <div class="card">
      <span class="card-title">Option 4: Chevron Growth E</span>
      <div class="logo-d4">
        <svg class="logo-d4-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 18L13 12L6 6" stroke="url(#gradient2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 18L19 12L12 6" stroke="url(#gradient2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.6;"/>
          <defs>
            <linearGradient id="gradient2" x1="6" y1="6" x2="19" y2="18" gradientUnits="userSpaceOnUse">
              <stop stop-color="#0db49e"/>
              <stop offset="1" stop-color="#06b6d4"/>
            </linearGradient>
          </defs>
        </svg>
        <span style="font-size: 28px; font-weight: 850;" class="gradient-text">EMS</span>
      </div>
    </div>

    <!-- Option 5 -->
    <div class="logo-d5">
      <span class="card-title">Option 5: Hexagonal Connected Mark</span>
      <div class="logo-d5-container">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L20 6.5V15.5L12 20L4 15.5V6.5L12 2Z" stroke="url(#gradient3)" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M12 7V17" stroke="url(#gradient3)" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M8 10H16" stroke="url(#gradient3)" stroke-width="2.5" stroke-linecap="round" style="opacity: 0.7;"/>
          <defs>
            <linearGradient id="gradient3" x1="4" y1="2" x2="20" y2="20" gradientUnits="userSpaceOnUse">
              <stop stop-color="#0db49e"/>
              <stop offset="1" stop-color="#06b6d4"/>
            </linearGradient>
          </defs>
        </svg>
        <span style="font-size: 28px; font-weight: 850;" class="gradient-text">EMS</span>
      </div>
    </div>
  </div>

</body>
</html>
