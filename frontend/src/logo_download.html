<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMS Premium Logo Downloader</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,800;0,900;1,700;1,800;1,900&display=swap');
    
    body {
      margin: 0;
      padding: 40px;
      background-color: #0B0F19;
      font-family: 'Montserrat', sans-serif;
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      max-width: 600px;
      width: 100%;
      background: #111827;
      border: 1px solid #1F2937;
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #14d2cb 0%, #089c96 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: #94A3B8;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .btn {
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-teal {
      background: linear-gradient(135deg, #14d2cb 0%, #089c96 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(20, 210, 203, 0.2);
    }

    .btn-teal:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(20, 210, 203, 0.3);
    }

    .btn-dark {
      background: #1F2937;
      color: #14d2cb;
      border: 1px solid #374151;
    }

    .btn-dark:hover {
      background: #374151;
      color: white;
      transform: translateY(-2px);
    }

    .btn-white {
      background: #FFFFFF;
      color: #111827;
      border: 1px solid #E5E7EB;
    }

    .btn-white:hover {
      background: #F9FAFB;
      transform: translateY(-2px);
    }

    canvas {
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>EMS Premium Logo Downloader</h1>
    <p>Generate and download the exact original logo design in ultra-high resolution (1600x900) PNG format.</p>

    <div class="button-group">
      <button class="btn btn-teal" onclick="downloadLogo('transparent')">
        💾 Download Transparent PNG Logo (Recommended)
      </button>
      <button class="btn btn-dark" onclick="downloadLogo('#111827')">
        💾 Download Dark Background PNG Logo
      </button>
      <button class="btn btn-white" onclick="downloadLogo('#FFFFFF')">
        💾 Download White Background PNG Logo
      </button>
    </div>
  </div>

  <!-- Hidden canvas to render high-res image -->
  <canvas id="logoCanvas" width="1600" height="900"></canvas>

  <script>
    // Wait for the Google font to load before drawing
    document.fonts.ready.then(() => {
      console.log('Fonts loaded');
    });

    function drawLogoOnCanvas(bgColor) {
      const canvas = document.getElementById('logoCanvas');
      const ctx = canvas.getContext('2d');
      const width = canvas.width;
      const height = canvas.height;

      // Clear/fill background
      ctx.setTransform(1, 0, 0, 1, 0, 0); // reset transform
      ctx.clearRect(0, 0, width, height);
      if (bgColor !== 'transparent') {
        ctx.fillStyle = bgColor;
        ctx.fillRect(0, 0, width, height);
      }

      // We apply horizontal slant/skew to match the original logo geometry
      // Skew angle matches the slanted look of the original image
      ctx.setTransform(1, 0, -0.15, 1, 0, 0);

      // Create gradient for teal shapes
      const grad = ctx.createLinearGradient(200, 0, 1100, 0);
      grad.addColorStop(0, '#14d2cb');
      grad.addColorStop(1, '#089c96');

      // Helper function to draw rounded rects
      function drawRoundedRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, r);
        ctx.fill();
      }

      // 1. Draw Slanted E-Bars (Icon)
      ctx.fillStyle = grad;
      drawRoundedRect(300, 240, 220, 52, 22); // Top bar
      drawRoundedRect(300, 318, 195, 52, 22); // Middle bar
      drawRoundedRect(300, 396, 205, 52, 22); // Bottom bar

      // 2. Draw Slanted "MS" Text (The logo is E icon + MS next to it!)
      // We use Outfit/Montserrat bold to exactly match the brand typography shape
      ctx.font = '800 220px Montserrat';
      
      // Original color is Dark Slate/Charcoal for "MS" in light background, but user wants gradient or original color
      // In the original, the text color is #102a35 (very dark slate/charcoal)
      ctx.fillStyle = '#102a35';
      
      // If the user requested background is dark, make it high contrast/light or same gradient
      if (bgColor === '#111827') {
        // High contrast slate or same gradient
        ctx.fillStyle = '#102b36'; // original dark slate (looks great on dark grey too!)
      }
      ctx.fillText('MS', 560, 425);

      // 3. Draw Slanted Bottom Banner
      ctx.fillStyle = grad;
      drawRoundedRect(300, 510, 830, 72, 36);

      // 4. Draw White Subtitle Text inside Banner
      ctx.font = '800 32px Montserrat';
      ctx.fillStyle = '#FFFFFF';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('EMPLOY MANAGEMENT SYSTEM', 715, 546);
    }

    function downloadLogo(bgColor) {
      drawLogoOnCanvas(bgColor);
      
      const canvas = document.getElementById('logoCanvas');
      const dataUrl = canvas.toDataURL('image/png');
      
      const link = document.createElement('a');
      link.download = `ems_logo_${bgColor === 'transparent' ? 'trans' : bgColor === '#FFFFFF' ? 'white' : 'dark'}.png`;
      link.href = dataUrl;
      link.click();
    }
  </script>

</body>
</html>
