# ==============================================================================
# OmniFlow EMS - Nginx Reverse-Proxy & White-Label Injection Configuration
# Add this inside /etc/nginx/sites-available/whatsapp-crm inside the server block
# ==============================================================================

# 1. Direct Webhook Ingestion Route (Fast-path for triggers)
location /webhook/ {
    proxy_pass http://127.0.0.1:5678/webhook/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

# 2. White-Labeled Automation Studio Reverse Proxy
location /automations-engine/ {
    proxy_pass http://127.0.0.1:5678/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 🛡️ White-Label Branding Overrides (HTML/CSS string replacement)
    sub_filter_types text/html text/css text/javascript application/javascript;
    sub_filter 'n8n.io' 'employeemanagementsystems.com';
    sub_filter '<title>n8n' '<title>OmniFlow Automation Studio';
    sub_filter 'n8n - Workflow Automation' 'OmniFlow EMS Automation Engine';
    sub_filter_once off;
}
